<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>flare-api-spec</title>
    <script>
      // 在 React 渲染前恢复主题，避免闪烁
      (function() {
        try {
          var saved = localStorage.getItem('flare-ui-state');
          if (saved) {
            var parsed = JSON.parse(saved);
            if (parsed.state && parsed.state.currentTheme) {
              document.documentElement.setAttribute('data-theme', parsed.state.currentTheme);
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
